<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.Site}}</title>
{{template "head-assets" .}}
<link rel="stylesheet" href="/static/public.css">
</head>
<body class="public-page">
<header class="public-toolbar">
  {{template "brand-lockup" .}}
  {{template "theme-control" .}}

<main class="focus-card message-card">

  <p class="notice">{{.Detail}}</p>
</main>
</body>
</html>
