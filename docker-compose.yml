services:
  share:
    build: .
    container_name: share
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      SHARE_USERNAME: admin
      SHARE_PASSWORD: change-me
      # SHARE_BASE_URL: https://share.example.com
      # SHARE_CHUNK_SIZE_MB: "auto"   # auto 按文件大小自适应，或固定 5–95
      # --- 可选：Cloudflare R2 存储（四项都填才会启用） ---
      # SHARE_R2_ENDPOINT: <accountid>.r2.cloudflarestorage.com
      # SHARE_R2_ACCESS_KEY: ...
      # SHARE_R2_SECRET_KEY: ...
      # SHARE_R2_BUCKET: share
